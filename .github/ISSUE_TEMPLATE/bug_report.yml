name: Bug report
description: Something in terminal-use doesn't work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. For a security problem, please don't open an issue — use **Security → Report a vulnerability** on the repository page instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you (or the agent) do, and what went wrong? Include the tool call and what it returned if you have them.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The shortest sequence of steps or tool calls that shows the problem.
      placeholder: |
        1. terminal_create {}
        2. terminal_type {"sessionId": 1, "text": "vim\n"}
        3. …
  - type: input
    id: version
    attributes:
      label: terminal-use version
      description: Output of `npx terminal-use --version`
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS and Node version
      placeholder: macOS 26.0, Node 22.12
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: MCP client
      placeholder: Claude Code 2.1, Cursor, …
  - type: input
    id: program
    attributes:
      label: Program running in the terminal, if relevant
      placeholder: vim, htop, a REPL, …
